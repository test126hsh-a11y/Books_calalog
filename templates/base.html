<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Книжный каталог</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='plum-logo.png') }}" />
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='plum-logo.png') }}" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <header class="mobile-header mobile-only">
      {% block mobile_header %}
      <a class="mobile-menu-btn" href="{{ url_for('mobile_menu') }}" aria-label="Открыть меню">
        <i class="fa-solid fa-bars"></i>
      </a>
      <h1 class="mobile-header-title">{% block mobile_title %}Книжный каталог{% endblock %}</h1>
      {% endblock %}
    </header>

    <div class="container">
      <aside class="sidebar desktop-only">
        <div>
          <div class="logo">
            <img
              src="{{ url_for('static', filename='plum-logo.png') }}"
              alt="Plums"
              class="logo-img"
            />
            <span>Книжный каталог</span>
          </div>
          <nav class="menu">
            <a href="{{ url_for('index') }}" class="{% if request.endpoint in ('index', 'view_book') %}active{% endif %}">
              <i class="fa-solid fa-book"></i>
              Книги
            </a>
            <a href="{{ url_for('new_book') }}" class="{% if request.path == url_for('new_book') %}active{% endif %}">
              <i class="fa-solid fa-plus"></i>
              Добавить книгу
            </a>
          </nav>
        </div>
        <div class="brand">Plums</div>
      </aside>
      <main class="main-content">{% block content %}{% endblock %}</main>
    </div>

    {% block scripts %}{% endblock %}
    <script>
      document.querySelectorAll(".book-form--edit, .add-book-form").forEach((form) => {
        const input = form.querySelector("[data-cover-input]");
        if (!input) return;

        form.querySelectorAll("[data-cover-trigger]").forEach((trigger) => {
          trigger.addEventListener("click", (event) => {
            event.preventDefault();
            input.click();
          });
        });

        input.addEventListener("change", () => {
          const file = input.files?.[0];
          const objectUrl = file ? URL.createObjectURL(file) : "";

          const group = input.closest(".form-group-file");
          const preview = group?.querySelector("[data-cover-preview]");
          const previewImg = preview?.querySelector("[data-cover-preview-img]");
          if (preview && previewImg) {
            if (file) {
              previewImg.src = objectUrl;
              preview.classList.remove("hidden");
            } else {
              previewImg.removeAttribute("src");
              preview.classList.add("hidden");
            }
          }

          const headerImg = form.querySelector("[data-cover-display-img]");
          const headerPlaceholder = form.querySelector("[data-cover-display-placeholder]");
          if (file && headerImg) {
            headerImg.src = objectUrl;
          } else if (file && headerPlaceholder) {
            headerPlaceholder.outerHTML =
              '<img class="edit-form-cover-img" alt="Обложка" data-cover-display-img src="' +
              objectUrl +
              '" />';
          }
        });
      });

      document.querySelectorAll(".add-book-form [data-cover-input]").forEach((input) => {
        const group = input.closest(".form-group-file");
        const preview = group?.querySelector("[data-cover-preview]");
        const previewImg = preview?.querySelector("[data-cover-preview-img]");
        if (!preview || !previewImg) return;

        input.addEventListener("change", () => {
          const file = input.files?.[0];
          if (file) {
            previewImg.src = URL.createObjectURL(file);
            preview.classList.remove("hidden");
          } else {
            previewImg.removeAttribute("src");
            preview.classList.add("hidden");
          }
        });
      });
    </script>
  </body>
</html>
